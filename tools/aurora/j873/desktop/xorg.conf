Section "ServerFlags"
    Option "AutoAddGPU" "false"
    Option "AutoAddDevices" "true"
    Option "BlankTime" "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime" "0"
EndSection

Section "Device"
    Identifier "J873 framebuffer"
    Driver "fbdev"
    Option "fbdev" "/dev/fb0"
    Option "ShadowFB" "true"
EndSection

Section "Screen"
    Identifier "J873 display"
    Device "J873 framebuffer"
    DefaultDepth 24
EndSection

Section "InputClass"
    Identifier "USB keyboard and trackpad"
    MatchIsKeyboard "on"
    Driver "libinput"
EndSection

Section "InputClass"
    Identifier "USB pointing devices"
    MatchIsPointer "on"
    Driver "libinput"
EndSection

Section "InputClass"
    Identifier "USB touchpads"
    MatchIsTouchpad "on"
    Driver "libinput"
    Option "Tapping" "true"
EndSection
