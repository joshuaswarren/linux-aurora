# First visual milestone uses the firmware framebuffer. GPU is a separate gate.
Section "ServerFlags"
    Option "AutoAddGPU" "false"
    Option "AutoBindGPU" "false"
    Option "AIGLX" "false"
    Option "AllowMouseOpenFail" "true"
EndSection
Section "Module"
    Disable "glx"
EndSection
Section "Extensions"
    Option "Composite" "Disable"
    Option "DRI2" "Disable"
    Option "DRI3" "Disable"
EndSection
Section "Device"
    Identifier "J813 framebuffer"
    Driver "fbdev"
    Option "fbdev" "/dev/fb0"
    Option "ShadowFB" "true"
EndSection
Section "Screen"
    Identifier "J813 screen"
    Device "J813 framebuffer"
    DefaultDepth 24
EndSection
Section "ServerLayout"
    Identifier "J813 layout"
    Screen "J813 screen"
EndSection
