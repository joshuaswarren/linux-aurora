# DCP presentation qualification. Application GPU acceleration is a later gate.
Section "ServerFlags"
    Option "AutoAddGPU" "false"
    Option "AutoBindGPU" "false"
    Option "AIGLX" "false"
    Option "AllowMouseOpenFail" "true"
EndSection
Section "Module"
    Disable "glx"
EndSection
Section "Extensions"
    Option "Composite" "Disable"
    Option "DRI2" "Disable"
    Option "DRI3" "Disable"
EndSection
Section "Device"
    Identifier "J813 DCP"
    Driver "modesetting"
    Option "kmsdev" "@KMS_DEVICE@"
    Option "AccelMethod" "none"
    Option "ShadowFB" "true"
EndSection
Section "Screen"
    Identifier "J813 screen"
    Device "J813 DCP"
    DefaultDepth 24
EndSection
Section "ServerLayout"
    Identifier "J813 layout"
    Screen "J813 screen"
EndSection
