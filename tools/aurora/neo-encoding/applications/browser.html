<!doctype html>
<meta charset="utf-8">
<title>Neo application suite — WebGL</title>
<style>body{background:#101a27;color:#fff;font:20px sans-serif;margin:32px}canvas{border:1px solid #789;width:480px;height:320px}pre{font-size:14px;white-space:pre-wrap}</style>
<h1>Neo application suite</h1><p>WebGL rendering and pixel readback</p><div id="canvases"></div><pre id="report">Running…</pre>
<script>
(async()=>{
 const result={userAgent:navigator.userAgent,tests:[]};
 for(const api of ['webgl','webgl2']){
  const canvas=document.createElement('canvas');canvas.width=96;canvas.height=64;
  document.querySelector('#canvases').append(canvas);
  const r={api,passed:false};result.tests.push(r);
  try{
   const gl=canvas.getContext(api,{antialias:false,preserveDrawingBuffer:true});
   if(!gl)throw Error('Context unavailable');
   r.vendor=gl.getParameter(gl.VENDOR);r.renderer=gl.getParameter(gl.RENDERER);r.version=gl.getParameter(gl.VERSION);
   const ext=gl.getExtension('WEBGL_debug_renderer_info');
   if(ext){r.unmaskedVendor=gl.getParameter(ext.UNMASKED_VENDOR_WEBGL);r.unmaskedRenderer=gl.getParameter(ext.UNMASKED_RENDERER_WEBGL);}
   const modern=api==='webgl2';
   function shader(type,source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;}
   const vs=shader(gl.VERTEX_SHADER,modern?'#version 300 es\nin vec2 p;void main(){gl_Position=vec4(p,0.,1.);}':'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}');
   const fs=shader(gl.FRAGMENT_SHADER,modern?'#version 300 es\nprecision mediump float;out vec4 color;void main(){color=vec4(0.2,0.8,0.4,1.);}':'precision mediump float;void main(){gl_FragColor=vec4(0.2,0.8,0.4,1.);}');
   const program=gl.createProgram();gl.attachShader(program,vs);gl.attachShader(program,fs);gl.linkProgram(program);
   if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));
   gl.useProgram(program);gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
   const location=gl.getAttribLocation(program,'p');gl.enableVertexAttribArray(location);gl.vertexAttribPointer(location,2,gl.FLOAT,false,0,0);
   r.frames=0;const start=performance.now();
   for(let frame=0;frame<30;frame++){await new Promise(requestAnimationFrame);gl.clearColor(frame%2,0,0,1);gl.clear(gl.COLOR_BUFFER_BIT);gl.drawArrays(gl.TRIANGLES,0,3);r.frames++;}
   gl.finish();const pixel=new Uint8Array(4);gl.readPixels(48,32,1,1,gl.RGBA,gl.UNSIGNED_BYTE,pixel);
   r.pixel=Array.from(pixel);r.elapsedMs=performance.now()-start;r.glError=gl.getError();
   r.passed=r.glError===gl.NO_ERROR&&r.pixel.every((n,i)=>Math.abs(n-[51,204,102,255][i])<=2);
   r.softwareRenderer=/llvmpipe|softpipe|swiftshader|software rasterizer/i.test(r.unmaskedRenderer||r.renderer);
  }catch(error){r.error=String(error);}
 }
 document.querySelector('#report').textContent=JSON.stringify(result,null,2);
 await fetch('/result'+location.search,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(result)});
})();
</script>
