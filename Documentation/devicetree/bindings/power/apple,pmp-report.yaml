%YAML 1.2
---
$id: http://devicetree.org/schemas/power/apple,pmp-report.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple SoC PMP Report Region

maintainers:
  - Ryan Murray <ryan@aurorasilicon.org>

description:
  The Power Management Processor (PMP) shares a register region with the
  application processors. The read window is an array of 16-byte entries in
  which the PMP publishes its status and control values, for example the
  die-temperature effort of each CPU cluster (see apple,cluster-cpufreq.yaml),
  and the application processors report the power state of the blocks the
  PMP accounts for in the update window. Child nodes describe those blocks;
  each one is a power domain whose state is reported to the PMP.

properties:
  compatible:
    enum:
      - apple,t6000-pmp-v2-report
      - apple,t6020-pmp-v2-report
      - apple,t8112-pmp-v2-report
      - apple,t8140-pmp-v2-report

  reg:
    maxItems: 1

  power-domains:
    maxItems: 1

  '#address-cells':
    const: 1

  '#size-cells':
    const: 0

patternProperties:
  "^report@[0-9a-f]+$":
    type: object
    description: A block whose power state is reported to the PMP.

    properties:
      compatible:
        oneOf:
          - const: apple,t6000-pmp-v2-report-entry
          - items:
              - enum:
                  - apple,t6020-pmp-v2-report-entry
                  - apple,t8112-pmp-v2-report-entry
              - const: apple,t6000-pmp-v2-report-entry

      reg:
        maxItems: 1
        description: Index of the block in the report.

      label:
        description: Name of the power domain.

      '#power-domain-cells':
        const: 0

      power-domains:
        maxItems: 1

      apple,always-on:
        type: boolean
        description: The block must be reported as powered at all times.

    required:
      - compatible
      - reg
      - label
      - '#power-domain-cells'

    additionalProperties: false

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    soc {
      #address-cells = <2>;
      #size-cells = <2>;

      pmp-report@23b3c0000 {
        compatible = "apple,t8112-pmp-v2-report";
        reg = <0x2 0x3b3c0000 0x0 0x20000>;
        power-domains = <&ps_pms_sram>;
        #address-cells = <1>;
        #size-cells = <0>;

        report@4 {
          compatible = "apple,t8112-pmp-v2-report-entry",
                       "apple,t6000-pmp-v2-report-entry";
          reg = <0x4>;
          label = "pmp-gfx";
          #power-domain-cells = <0>;
          power-domains = <&ps_gfx>;
        };
      };
    };
