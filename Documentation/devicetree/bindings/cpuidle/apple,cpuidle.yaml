%YAML 1.2
---
$id: http://devicetree.org/schemas/cpuidle/apple,cpuidle.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple T8140 CPU idle

maintainers:
  - Ryan Murray <ryan@aurorasilicon.org>

description: |
  The Apple CPU idle driver uses a core system register to request CPU power
  down. A T8140 board opts in through this node. Software must preserve CPU
  state across entry and restore it after an interrupt.

properties:
  compatible:
    const: apple,t8140-cpuidle

required:
  - compatible

additionalProperties: false

examples:
  - |
    cpuidle {
        compatible = "apple,t8140-cpuidle";
    };
