%YAML 1.2
---
$id: http://devicetree.org/schemas/rtc/apple,smc-rtc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple SMC RTC

description:
  Apple Silicon Macs (M1, etc.) have an RTC that is part of the PMU IC,
  but most of the PMU functionality is abstracted out by the SMC.
  An additional RTC offset stored inside NVMEM is required to compute
  the current date/time.

maintainers:
  - Sven Peter <sven@kernel.org>

properties:
  compatible:
    const: apple,smc-rtc

  nvmem-cells:
    items:
      - description:
          RTC offset. 48bit, specified in 32768 (2^15) Hz clock ticks, unless
          apple,rtc-offset-seconds is set, in which case it is a 64bit
          little-endian count of whole seconds.

  nvmem-cell-names:
    items:
      - const: rtc_offset

  apple,rtc-offset-seconds:
    type: boolean
    description:
      The PMU keeps the RTC offset as whole seconds in its legacy scratchpad
      (t8140 "baku" PMU and later) rather than as 32768 Hz ticks. The current
      time is then the counter's integer seconds plus the offset.

required:
  - compatible
  - nvmem-cells
  - nvmem-cell-names

additionalProperties: false
