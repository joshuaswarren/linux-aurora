%YAML 1.2
---
$id: http://devicetree.org/schemas/mailbox/apple,mailbox.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple Mailbox Controller

maintainers:
  - Hector Martin <marcan@marcan.st>
  - Sven Peter <sven@svenpeter.dev>

description:
  The Apple mailbox consists of two FIFOs used to exchange 64+32 bit
  messages between the main CPU and a co-processor. Multiple instances
  of this mailbox can be found on Apple SoCs.
  One of the two FIFOs is used to send data to a co-processor while the other
  FIFO is used for the other direction.
  Various clients implement different IPC protocols based on these simple
  messages and shared memory buffers.

properties:
  compatible:
    oneOf:
      - description:
          ASC mailboxes are the most common variant found on the M1 used
          for example for the display controller, the system management
          controller and the NVMe coprocessor.
        items:
          - enum:
              - apple,t8103-asc-mailbox
              - apple,t8112-asc-mailbox
              - apple,t8122-asc-mailbox
              - apple,t8140-asc-mailbox
              - apple,t6000-asc-mailbox
              - apple,t6020-asc-mailbox
          - const: apple,asc-mailbox-v4

      - description:
          AOP setup-port mailbox with a separate register layout.
        const: apple,t8140-aop-setup-mailbox

      - description:
          An older ASC mailbox interface found on T2 and A11 that is also
          used for the NVMe coprocessor and the system management
          controller.
        items:
          - const: apple,t8015-asc-mailbox

      - description:
          The second ("setup port") mailbox of the T8140 AOP, through which
          its firmware exchanges the endpoint buffer setup and source-buffer
          binding messages.  Two control words at 0x0/0x4, send registers at
          0x180/0x188 and receive registers at 0x1b0/0x1b8.
        items:
          - const: apple,t8140-aop-setup-mailbox

      - description:
          ASCWrap v6 mailbox transport for the two independent T8140 GPU
          firmware roles. The mailbox-v4 register ABI is embedded at offset
          0x8000 in the first register window. The second register window is
          lifecycle-owned IORVBAR state and is not mailbox MMIO.
        const: apple,t8140-ascwrap-v6

      - description:
          M3 mailboxes are an older variant with a slightly different MMIO
          interface still found on the M1. It is used for the Thunderbolt
          co-processors.
        items:
          - enum:
              - apple,t8103-m3-mailbox
              - apple,t8112-m3-mailbox
              - apple,t6000-m3-mailbox
          - const: apple,m3-mailbox-v2

  reg:
    minItems: 1
    maxItems: 2

  reg-names:
    minItems: 2
    maxItems: 2

  interrupts:
    minItems: 2
    maxItems: 4

  interrupt-names:
    minItems: 2
    maxItems: 4

  iommus:
    maxItems: 1

  apple,dma-range:
    $ref: /schemas/types.yaml#/definitions/uint64-array
    minItems: 2
    maxItems: 2
    description:
      Setup-port DMA allocation window, expressed as a base and nonzero size.
      This identifies host-available slots in the inherited AOP stream root.

  "#mbox-cells":
    const: 0

  power-domains:
    maxItems: 1

allOf:
  - if:
      properties:
        compatible:
          contains:
            const: apple,t8140-aop-setup-mailbox
    then:
      properties:
        interrupts:
          maxItems: 2
        interrupt-names:
          items:
            - const: send-empty
            - const: recv-not-empty
      required:
        - iommus
        - apple,dma-range
    else:
      properties:
        interrupts:
          minItems: 4
        interrupt-names:
          items:
            - const: send-empty
            - const: send-not-empty
            - const: recv-empty
            - const: recv-not-empty
        iommus: false
        apple,dma-range: false

required:
  - compatible
  - reg
  - interrupts
  - interrupt-names
  - "#mbox-cells"

allOf:
  - if:
      properties:
        compatible:
          contains:
            const: apple,t8140-ascwrap-v6
    then:
      properties:
        reg:
          items:
            - description: ASCWrap v6 register window containing the mailbox
            - description: Eight-byte IOP reset-vector-base-address register
        reg-names:
          items:
            - const: wrapper
            - const: iop-vbar
        interrupts:
          items:
            - description: send FIFO is empty interrupt
            - description: receive FIFO is not empty interrupt
        interrupt-names:
          items:
            - const: send-empty
            - const: recv-not-empty
      required:
        - reg-names
        - apple,firmware-role
    else:
      properties:
        reg:
          maxItems: 1
        reg-names: false
        interrupts:
          items:
            - description: send FIFO is empty interrupt
            - description: send FIFO is not empty interrupt
            - description: receive FIFO is empty interrupt
            - description: receive FIFO is not empty interrupt
        interrupt-names:
          items:
            - const: send-empty
            - const: send-not-empty
            - const: recv-empty
            - const: recv-not-empty
        apple,firmware-role: false

additionalProperties: false

examples:
  - |
    mailbox@77408000 {
        compatible = "apple,t8103-asc-mailbox", "apple,asc-mailbox-v4";
        reg = <0x77408000 0x4000>;
        interrupts = <1 583 4>, <1 584 4>, <1 585 4>, <1 586 4>;
        interrupt-names = "send-empty", "send-not-empty",
                          "recv-empty", "recv-not-empty";
        #mbox-cells = <0>;
    };

  - |
    #include <dt-bindings/interrupt-controller/apple-aic.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    soc {
        #address-cells = <2>;
        #size-cells = <2>;

        gfx_asc: mailbox@482600000 {
            compatible = "apple,t8140-ascwrap-v6";
            reg = <0x4 0x82600000 0x0 0x88000>,
                  <0x4 0x82050000 0x0 0x8>;
            reg-names = "wrapper", "iop-vbar";
            interrupts = <AIC_IRQ 993 IRQ_TYPE_LEVEL_HIGH>,
                         <AIC_IRQ 996 IRQ_TYPE_LEVEL_HIGH>;
            interrupt-names = "send-empty", "recv-not-empty";
            apple,firmware-role = "GFX";
            #mbox-cells = <0>;
        };

        gfx1_asc: mailbox@482e00000 {
            compatible = "apple,t8140-ascwrap-v6";
            reg = <0x4 0x82e00000 0x0 0x88000>,
                  <0x4 0x82850000 0x0 0x8>;
            reg-names = "wrapper", "iop-vbar";
            interrupts = <AIC_IRQ 997 IRQ_TYPE_LEVEL_HIGH>,
                         <AIC_IRQ 1000 IRQ_TYPE_LEVEL_HIGH>;
            interrupt-names = "send-empty", "recv-not-empty";
            apple,firmware-role = "GFX1";
            #mbox-cells = <0>;
        };
    };
