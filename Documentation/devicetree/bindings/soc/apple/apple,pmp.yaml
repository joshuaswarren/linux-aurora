%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/apple/apple,pmp.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple SoC Power Management Processor

maintainers:
  - Ryan Murray <ryan@aurorasilicon.org>

description:
  The Power Management Processor (PMP) is an RTKit coprocessor that manages
  SoC power and performance. Its firmware is loaded by the bootloader, which
  also adds the board and firmware configuration properties below and enables
  the node. The application processor starts the firmware and serves its
  requests for memory and configuration values.

properties:
  compatible:
    oneOf:
      - const: apple,t6000-pmp-v2
      - items:
          - enum:
              - apple,t6020-pmp-v2
              - apple,t8112-pmp-v2
              - apple,t8140-pmp-v2
          - const: apple,t6000-pmp-v2

  reg:
    items:
      - description: PMP memory holding the firmware boot arguments
      - description: ASC processor control registers

  reg-names:
    items:
      - const: pmp
      - const: asc

  mboxes:
    maxItems: 1

  mbox-names:
    const: mbox

  iommus:
    maxItems: 1

  power-domains:
    maxItems: 1

  apple,board-id:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Board identifier, added by the bootloader.

  apple,dram-vendor-id:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: DRAM vendor identifier, added by the bootloader.

  apple,dram-capacity:
    $ref: /schemas/types.yaml#/definitions/uint32
    description:
      DRAM capacity, added by the bootloader when the firmware configuration
      provides it.

  apple,pio-ranges:
    $ref: /schemas/types.yaml#/definitions/uint64-matrix
    items:
      items:
        - description: Physical base address of the register range
        - description: Size of the register range
    description:
      Register ranges the firmware accesses through the DART. They are mapped
      and listed for the firmware when it asks for them.

patternProperties:
  "^apple,tunable-.+$":
    $ref: /schemas/types.yaml#/definitions/uint8-array
    description:
      Firmware configuration values, copied by the bootloader from the Apple
      device tree and handed to the firmware when it requests them by name.

required:
  - compatible
  - reg
  - reg-names
  - mboxes
  - mbox-names
  - iommus
  - power-domains

additionalProperties: false

examples:
  - |
    soc {
      #address-cells = <2>;
      #size-cells = <2>;

      pmp@300500000 {
        compatible = "apple,t8140-pmp-v2", "apple,t6000-pmp-v2";
        reg = <0x3 0x00500000 0x0 0xa0000>,
              <0x3 0x00e00000 0x0 0x4000>;
        reg-names = "pmp", "asc";
        mboxes = <&pmp_mbox>;
        mbox-names = "mbox";
        iommus = <&pmp_dart 0>;
        power-domains = <&ps_pmp>;
      };
    };
